version: v2beta1

vars:
  AGYND_NAMESPACE: platform
  DEV_IMAGE: ghcr.io/agynio/devcontainer-go:1
  AGYND_ARGOCD_APP: agynd
  AGYND_DEPLOYMENT: agynd-agynd

functions:
  disable_argocd_sync: |-
    if kubectl get application ${AGYND_ARGOCD_APP} -n argocd >/dev/null 2>&1; then
      echo "Disabling ArgoCD auto-sync for ${AGYND_ARGOCD_APP}..."
      kubectl patch application ${AGYND_ARGOCD_APP} -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":null}}}'
      echo "ArgoCD auto-sync disabled."
    else
      echo "ArgoCD Application '${AGYND_ARGOCD_APP}' not found; using baseline stack."
    fi
  restore_argocd_sync: &restore_argocd_sync |-
    if kubectl get application ${AGYND_ARGOCD_APP} -n argocd >/dev/null 2>&1; then
      echo "Re-enabling ArgoCD auto-sync for ${AGYND_ARGOCD_APP}..."
      kubectl patch application ${AGYND_ARGOCD_APP} -n argocd \
        --type merge \
        -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
      echo "ArgoCD auto-sync restored."
    else
      echo "ArgoCD Application '${AGYND_ARGOCD_APP}' not found; no sync policy to restore."
    fi
  agynd_deployment_exists: |-
    kubectl get deployment ${AGYND_DEPLOYMENT} -n ${AGYND_NAMESPACE} >/dev/null 2>&1
  patch_deployment: |-
    if ! agynd_deployment_exists; then
      echo "Deployment '${AGYND_DEPLOYMENT}' not found in namespace '${AGYND_NAMESPACE}'; using baseline stack."
      return 0
    fi

    echo "Patching ${AGYND_DEPLOYMENT} deployment for DevSpace..."
    kubectl patch deployment ${AGYND_DEPLOYMENT} -n ${AGYND_NAMESPACE} --type strategic --patch "$(cat <<'EOF'
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1000
            fsGroup: 1000
          initContainers: []
          volumes:
            - name: data
              emptyDir: {}
          containers:
            - name: agynd
              image: ghcr.io/agynio/devcontainer-go:1 # keep in sync with DEV_IMAGE
              workingDir: /opt/app/data
              command:
                - sh
                - -c
                - |
                  set -eu
                  elapsed=0
                  while [ ! -f /opt/app/data/go.mod ]; do
                    sleep 1; elapsed=$((elapsed + 1))
                    [ "$elapsed" -ge 120 ] && { echo "ERROR: sync timeout" >&2; exit 1; }
                  done
                  buf generate buf.build/agynio/api \
                    --path agynio/api/gateway/v1 \
                    --include-imports
                  exec go run ./cmd/agynd
              volumeMounts:
                - name: data
                  mountPath: /opt/app/data
              resources:
                requests:
                  cpu: 500m
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 4Gi
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                readOnlyRootFilesystem: false
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
    EOF
    )"

pipelines:
  dev:
    flags:
      - name: watch
        short: w
        description: "Keep DevSpace running and stream logs"
    run: |-
      disable_argocd_sync
      patch_deployment
      if ! agynd_deployment_exists; then
        echo "No agynd deployment is provisioned; deploy step completed against baseline stack."
      elif [ "$(get_flag "watch")" == "true" ]; then
        start_dev --disable-pod-replace agynd
      else
        start_dev --disable-pod-replace agynd
        sleep 10
        echo "Dev environment ready. Stopping dev session."
        stop_dev agynd
      fi

hooks:
  - name: restore-argocd-auto-sync
    events:
      - after:dev:agynd
    command: bash
    args:
      - -c
      - *restore_argocd_sync

dev:
  agynd:
    namespace: ${AGYND_NAMESPACE}
    labelSelector:
      app.kubernetes.io/name: agynd
      app.kubernetes.io/instance: agynd
    containers:
      agynd:
        container: agynd
        sync:
          - path: ./:/opt/app/data
            excludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
            uploadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
            downloadExcludePaths:
              - .git/
              - .devspace/
              - /.gen/
              - /tmp/
