name: E2E

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/agynio/*
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git for private modules
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Provision cluster
        uses: agynio/bootstrap/.github/actions/provision@main

      - name: Setup DevSpace
        uses: agynio/e2e/.github/actions/setup-devspace@main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Install buf
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.66.0

      - name: Generate protobuf bindings
        run: |
          buf generate buf.build/agynio/api \
            --path agynio/api/gateway/v1 \
            --include-imports

      - name: Build agynd binary
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/agynd ./cmd/agynd

      - name: Run E2E tests
        uses: agynio/e2e/.github/actions/run-tests@main
        env:
          AGYND_BINARY: ${{ github.workspace }}/dist/agynd
          E2E_SUITES: playwright-tracing-app
        with:
          tag: svc_agents_orchestrator
          include_smoke: false
