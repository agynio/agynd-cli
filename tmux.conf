# Platform configuration for the tmux server behind persistent shells.
#
# Delivered to /agyn/tmux.conf by the init container and passed to every server
# and client invocation with -f. A ~/.tmux.conf is deliberately not sourced:
# the settings this model depends on are exactly the ones a personal config
# likes to change.

# --- Lifetime -------------------------------------------------------------

# agynd starts the server before any shell exists, and by default a server with
# no sessions exits immediately. It owns the server's lifetime; the server does
# not own its own.
set -s exit-empty off

# --- The shell a new window spawns ---------------------------------------

# The login profile runs first and /agyn/bin goes in front of whatever it left.
# The order matters: /etc/profile on Debian and Ubuntu assigns PATH
# unconditionally, so a prefix set ahead of it would be discarded on exactly
# the base images most likely to be in use.
#
# This lives here rather than in the command the Terminal Proxy binds because
# that command is a tmux client; the shell is the server's child, and setting
# PATH around the client would never reach it.
# Single-quoted so tmux passes it through untouched: it expands ${...} inside
# double quotes and rejects the shell's ${VAR:-default} form as an invalid
# environment variable. The expansion wanted here is sh's, not tmux's.
set -g default-command '/bin/sh -lc "PATH=/agyn/bin:$PATH exec ${SHELL:-sh}"'

# default-shell is deliberately not set. tmux exports its value as SHELL into
# every pane, so naming one here overrides what the image chose -- an image
# whose user is zsh got sh, because the command below then read SHELL back and
# found what tmux had just written. Left alone, tmux resolves the user's shell
# and falls back to /bin/sh itself where no passwd entry exists, which is the
# case naming it was meant to cover.

# A shell ends when its process does. Nothing lingers to be reattached to, and
# the client holding a tab removes it.
set -g remain-on-exit off

# --- Not a user interface -------------------------------------------------

# No prefix key. Every key belongs to the program in the shell, including an
# engineer's own nested tmux — which is cleaner here than normal nesting,
# since nothing is competing for C-b.
set -g prefix None
set -g prefix2 None
unbind-key -a -T prefix

# The root and copy-mode tables are left alone on purpose. Their defaults are
# the mouse bindings, and unbinding them would take scrollback and selection
# with them.

# The client draws whatever UI there is. A status bar is a row taken from the
# program for something no consumer reads.
set -g status off

# Wheel scrolling reaches the scrollback; mouse events still reach a program
# that asked for them.
set -g mouse on

# Forward a title to the client. Without this tmux emits none, and a client
# naming its tabs from what the shell announces has nothing to read -- every
# tab keeps the number it opened with.
#
# pane_title is what the program set through OSC, and tmux defaults it to the
# hostname when nothing has. So the hostname is treated as "unset" and the
# running command stands in, which is what a terminal shows when a program
# announces nothing.
set -g set-titles on
set -g set-titles-string "#{?#{==:#{pane_title},#{host}},#{pane_current_command},#{pane_title}}"

# --- Terminal capabilities ------------------------------------------------

# tmux-256color is compiled into the binary's terminfo fallbacks, so this
# resolves in an image carrying no terminal database at all.
set -g default-terminal "tmux-256color"

# Truecolor through to the client, and OSC 52 so a selection made in a shell
# reaches the clipboard — no window system is shared with it.
set -as terminal-features ',*:RGB'
set -as terminal-features ',*:clipboard'
set -g set-clipboard on

# An ESC keypress should not cost a round trip in vim.
set -s escape-time 0

# --- Resources ------------------------------------------------------------

# Scrollback per shell, held in the container's memory and charged to the
# sandbox's flavor.
set -g history-limit 10000
